[project]
name = "univscrap"
version = "0.1.0"
description = "Async scraper & FastAPI backend for Indonesian University Admission (SNPMB) data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[project.scripts]
univscrap = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
