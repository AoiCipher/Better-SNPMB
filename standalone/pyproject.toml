[project]
name = "snpmb-standalone"
version = "0.1.0"
description = "Standalone CLI scraper & data exporter for Better SNPMB Data Explorer (B-SNPMB)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
snpmb-pull = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
