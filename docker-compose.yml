services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    container_name: better-snpmb
    env_file:
      - path: ./frontend/.env
        required: false
    ports:
      - "8000:8000"
      - "3000:3000"
